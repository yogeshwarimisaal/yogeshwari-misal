name: Weekly Database Backup

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create backup folder
        run: mkdir -p backups

      - name: Dump data backup
        run: |
          DATE=$(date +%Y-%m-%d)
          supabase db dump \
            --db-url "${{ secrets.SUPABASE_DB_URL }}" \
            --data-only \
            -f backups/data_${DATE}.sql
          echo "✅ Backup created: backups/data_${DATE}.sql"
          wc -l backups/data_${DATE}.sql

      - name: Keep only last 8 backups
        run: |
          cd backups
          COUNT=$(ls data_*.sql 2>/dev/null | wc -l)
          echo "Current backup count: $COUNT"
          if [ "$COUNT" -gt 8 ]; then
            ls -t data_*.sql | tail -n +9 | xargs rm -f
            echo "Cleaned old backups"
          fi

      - name: Commit and push
        run: |
          git config user.name "Backup Bot"
          git config user.email "backup@yogeshwarimisal"
          git add backups/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Weekly backup $(date +%Y-%m-%d)"
            git push origin HEAD
          fi