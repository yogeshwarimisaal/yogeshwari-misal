name: Weekly Database Backup

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # Required for git push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create backup folder
        run: mkdir -p backups

      - name: Export database (data only)
        run: |
          DATE=$(date +%Y-%m-%d)
          BACKUP_FILE="backups/data_${DATE}.sql"
          supabase db dump \
            --db-url "${{ secrets.SUPABASE_DB_URL }}" \
            --data-only \
            -f "$BACKUP_FILE"
          if [ ! -s "$BACKUP_FILE" ]; then
            echo "❌ Backup failed"
            exit 1
          fi
          echo "✅ Backup created: $BACKUP_FILE ($(wc -l < "$BACKUP_FILE") lines)"

      - name: Keep only last 8 backups
        run: |
          cd backups
          ls -t data_*.sql 2>/dev/null | tail -n +9 | xargs -r rm -f
          echo "Remaining backups: $(ls data_*.sql | wc -l)"

      - name: Commit and push backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Automated database backup $(date +%Y-%m-%d)"
          git push origin HEAD